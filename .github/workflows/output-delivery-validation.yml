name: Validate output delivery

# Runs the API and the executor as plain jars and checks what the Console shows after the executor is killed
# in the middle of a step. It builds both jars, so it runs when the output delivery code or the scenario
# changes (pull requests and main), once a week, and on demand. It is not a required check: a required check
# that a path filter skips would block unrelated pull requests.
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/validation/output-delivery/**'
      - '.github/workflows/output-delivery-validation.yml'
      - 'executor/src/main/java/io/terrakube/executor/service/logs/**'
      - 'executor/src/main/java/io/terrakube/executor/service/status/**'
      - 'executor/src/main/java/io/terrakube/executor/plugin/tfstate/**'
      - 'api/src/main/java/io/terrakube/api/plugin/logs/**'
      - 'api/src/main/java/io/terrakube/api/plugin/storage/**'
      - 'api/src/main/java/io/terrakube/api/plugin/scheduler/reconciliation/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/validation/output-delivery/**'
      - '.github/workflows/output-delivery-validation.yml'
      - 'executor/src/main/java/io/terrakube/executor/service/logs/**'
      - 'executor/src/main/java/io/terrakube/executor/service/status/**'
      - 'executor/src/main/java/io/terrakube/executor/plugin/tfstate/**'
      - 'api/src/main/java/io/terrakube/api/plugin/logs/**'
      - 'api/src/main/java/io/terrakube/api/plugin/storage/**'
      - 'api/src/main/java/io/terrakube/api/plugin/scheduler/reconciliation/**'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kill-mid-step:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: maven
      - name: Build the API and the executor
        run: mvn -B -ntp -q -pl api,executor -am package -DskipTests -Dspring-boot.build-image.skip=true
      - name: Start Redis
        run: |
          docker run -d --name redis -p 6379:6379 redis:7-alpine redis-server --requirepass password123456
          for _ in $(seq 1 20); do docker exec redis redis-cli -a password123456 ping 2>/dev/null | grep -q PONG && exit 0; sleep 1; done
          exit 1
      - name: Kill the executor in the middle of a step
        run: scripts/validation/output-delivery/run.sh kill-mid-step
        env:
          API_JAR: api/target/api-server-*.jar
          EXECUTOR_JAR: executor/target/executor-*.jar
          WORK_DIR: ${{ runner.temp }}/output-delivery
      - name: Keep the logs of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: output-delivery-logs
          path: |
            ${{ runner.temp }}/output-delivery/api.log
            ${{ runner.temp }}/output-delivery/executor.log
          retention-days: 7
