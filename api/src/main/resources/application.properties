########
# LOGS #
########
# Completed-step logs are immutable - cache them so many concurrent viewers plus polling collapse
# to a single storage read. Objects larger than cacheable-max-object-bytes stream through uncached.
io.terrakube.logs.cache-max-weight-bytes=${LogsCacheMaxWeightBytes:268435456}
io.terrakube.logs.cache-ttl=${LogsCacheTtl:10m}
io.terrakube.logs.cacheable-max-object-bytes=${LogsCacheableMaxObjectBytes:1048576}
# Running-step plain GET returns at most this many trailing lines from the Redis stream, so it never
# scans the whole (potentially huge) stream from the start.
io.terrakube.logs.live-tail-records=${LogsLiveTailRecords:5000}
# Step-log SSE: one Redis reader per job fans out to all its viewers. Per-pod connection cap returns
# 503 + Retry-After beyond the limit; a stream is closed after sse-max-stream-duration and the client
# reconnects with Last-Event-ID.
io.terrakube.logs.sse-max-connections=${LogsSseMaxConnections:1500}
io.terrakube.logs.sse-job-idle-timeout=${LogsSseJobIdleTimeout:2s}
io.terrakube.logs.sse-max-stream-duration=${LogsSseMaxStreamDuration:30m}
io.terrakube.logs.job-status-cache-ttl=${LogsJobStatusCacheTtl:2s}
# Cap on a job's live-log Redis stream when logs are ingested via the API (/logs endpoint).
io.terrakube.logs.redis-max-len=${LogsRedisMaxLen:200000}
# Housekeeping sweep that reclaims the {jobId} and {jobId}-context Redis streams once a job has been
# terminal for grace-period-minutes; only jobs terminal within the trailing lookback window are scanned.
io.terrakube.logs.stream-cleanup.cron=${LogsStreamCleanupCron:0 */10 * * * ?}
io.terrakube.logs.stream-cleanup.grace-period-minutes=${LogsStreamCleanupGracePeriodMinutes:30}
io.terrakube.logs.stream-cleanup.lookback-hours=${LogsStreamCleanupLookbackHours:24}

