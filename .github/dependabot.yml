version: 2
updates:
  # Yarn: React application
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      ui-packages:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  # Maven: Parent project
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "com.github.jknack:handlebars-helpers"
      - dependency-name: "com.github.jknack:handlebars"
    groups:
      mvn-packages:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  # Docker: UI Dockerfile (node builder, nginx runtime, syft SBOM)
  - package-ecosystem: "docker"
    directory: "/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      ui-docker-images:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  # Docker: Dev Container Dockerfile (java devcontainer base image)
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      devcontainer-docker-images:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
