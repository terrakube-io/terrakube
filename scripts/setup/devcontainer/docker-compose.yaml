services:
  dex-service:
    image: ghcr.io/dexidp/dex:v2.32.0
    container_name: dex-service
    volumes:
      - ./config-ldap.yaml:/etc/dex/config.docker.yaml
    ports:
      - 5556:5556

  ldap-service:
    image: osixia/openldap:1.5.0
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cp /bootstrap-source/config-ldap.ldif /container/service/slapd/assets/config/bootstrap/ldif/custom/
        exec /container/tool/run
    environment:
      LDAP_ORGANISATION: "Example, Inc"
      LDAP_DOMAIN: "example.org"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_TLS: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    volumes:
      # OpenLDAP rewrites LDIF files while importing them. Copy the tracked
      # source into the container instead of allowing it to modify the worktree.
      - ./ldif/config-ldap.ldif:/bootstrap-source/config-ldap.ldif:ro
    ports:
      - 389:389

volumes:
  data1-1:
  redis_data:
