name: Build Terrakube UI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'ui/**'

permissions:
  contents: read

jobs:
  buildui:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository || !github.event.pull_request.draft }}
    defaults:
      run:
        working-directory: ./ui

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use Node.js from ui/.node-version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ui/.node-version

      # Node 25+ no longer bundles Corepack, and setup-node's yarn cache needs yarn on PATH.
      - name: Enable Corepack
        run: npm install -g corepack@0.36.0 && corepack enable

      - name: Cache yarn downloads
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ui/.node-version
          cache: "yarn"
          cache-dependency-path: ui/yarn.lock

      - name: "Install dependencies"
        run: yarn install --immutable

      - name: "Check linting"
        run: yarn lint:check

      - name: "Check formatting"
        run: yarn format:check

      - name: "Check types"
        run: yarn typecheck

      - name: "Run unit tests"
        run: yarn test --ci

      - name: "Build application"
        run: yarn build
        env:
          CI: false
