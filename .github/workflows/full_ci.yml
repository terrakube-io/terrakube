name: Full Backend CI

# Maintainer opt-in: adding the full-ci label runs the full Maven build once for a fork PR.
# Kept separate from pull_request.yml so other labels never replace its check results.
# Runs as pull_request (not pull_request_target), so fork code gets no secrets.
on:
  pull_request:
    types: [labeled]
    paths-ignore:
      - 'ui/**'
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

# Other labels get a unique group so they never cancel a running full build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}${{ github.event.label.name != 'full-ci' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  full-ci:
    runs-on: ubuntu-latest
    if: ${{ github.event.label.name == 'full-ci' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'liberica'
      - name: Cache Maven packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build Terrakube from Fork
        run: mvn clean install -Dspring-boot.build-image.skip=true
